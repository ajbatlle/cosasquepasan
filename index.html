<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cosas que pasan</title>
<meta name="description" content="Cosas que pasan, de Antonio Batlle.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="cosas que pasan">
<meta property="og:description" content="Cosas que pasan, de Antonio Batlle.">
<meta property="og:locale" content="es_CL">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23003ec0'/%3E%3C/svg%3E">
<link rel="preload" href="fuentes/PlusJakartaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Retícula (la de las hojas A4 de producto, pasada a pantalla)
   Unidad base u: interlineado del cuerpo. Todo espacio vertical es múltiplo de u.
   12 columnas, medianil = u. Todo bloque parte en el inicio de una columna.
   Rótulo en las columnas 1–4, texto desde la 5.

   Escala tipográfica, razón 1,25 desde 1 rem:
     0,8 · 1 · 1,25 · 2,44 · 3,05
   Para ver la retícula: abrir con ?grilla o pulsar «g».
   ────────────────────────────────────────────────────────────────────────── */

@font-face {
  /* Solo para las imágenes que se comparten (canvas): el diseño de los posts de Instagram. */
  font-family: 'EB Garamond';
  font-weight: 400 800;
  font-display: swap;
  src: url('fuentes/EBGaramond-Variable.woff2') format('woff2-variations'),
       url('fuentes/EBGaramond-Variable.woff2') format('woff2');
}

@font-face {
  font-family: 'Plus Jakarta Sans';
  font-weight: 200 800;
  font-display: swap;
  src: url('fuentes/PlusJakartaSans-Variable.woff2') format('woff2-variations'),
       url('fuentes/PlusJakartaSans-Variable.woff2') format('woff2');
}

:root {
  --u: clamp(1.375rem, 1.2rem + 0.4vw, 1.5rem);
  --margen: clamp(1.25rem, 0.5rem + 3vw, 4.5rem);
  /* Ancho proporcional, como el contenedor del sitio: 86 % en móvil, 76 % en tablet,
     64 % en escritorio. Con márgenes en píxeles el aire desaparece en pantallas chicas. */
  --ancho: min(86vw, 1280px);
  --col: calc((var(--ancho) - 11 * var(--u)) / 12);

  --t-1: 0.8rem;
  --t0: 1rem;
  --t1: 1.25rem;
  --t4: 2.44rem;
  --t5: 3rem; /* una portada no pasa de 3 rem */

  --negro: #0a0a0a;
  --blanco: #fff;
  --azul: #003ec0; /* el azul del logo en las hojas */
  --texto: var(--negro);
  --gris: #6b6b6b;

  /* El puntero es el isotipo: azul sobre blanco, blanco sobre lo que sea azul.
     SVG por delante y PNG detrás (Safari no admite cursores SVG). Punto activo al centro. */
  --cursor-blanco: url('brand/cursor-blanco.svg') 16 16, url('brand/cursor-blanco.png') 16 16, auto;
  --cursor-azul: url('brand/cursor-azul.svg') 16 16, url('brand/cursor-azul.png') 16 16, auto;
  --cursor: var(--cursor-azul);

  /* Curva única de Bastos: arranca con decisión y frena largo. Sin rebote. */
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
  --rapido: 0.25s var(--ease);
  --normal: 0.45s var(--ease);
  --lento: 0.7s var(--ease);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { background: var(--blanco); -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  font-size: var(--t0);
  line-height: var(--u);
  color: var(--texto);
  background: var(--blanco);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  cursor: var(--cursor);
}

/* Los enlaces y botones traen su propio cursor: hay que decirles que usen el isotipo.
   Lo pulsable se distingue por subrayados, píldoras y marcas que crecen, no por la manita. */
a, button { cursor: var(--cursor); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; text-align: left; }

:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }

/* ── Píldora: contorno fino de 1px, no un marco. Al pasar se llena de azul
   y el cursor se invierte a blanco, o desaparecería sobre el relleno. ── */
.pildora {
  display: inline-flex;
  align-items: center;
  padding: 0.5em 1.8em;
  color: var(--azul);
  border: 1px solid var(--azul);
  border-radius: 9999px;
  font-size: var(--t-1);
  line-height: 1;
  white-space: nowrap;
  text-align: center;
  transition: background var(--normal), color var(--normal), border-color var(--normal);
}
.pildora:hover, .pildora:focus-visible { background: var(--azul); color: var(--blanco); --cursor: var(--cursor-blanco); cursor: var(--cursor); }

/* Saltar al contenido: invisible hasta que recibe foco. */
.salto { position: absolute; left: var(--u); top: -100%; z-index: 20; padding: 0.75em 1.25em; background: var(--blanco); color: var(--azul); font-size: var(--t-1); font-weight: 600; }
.salto:focus { top: var(--u); }

/* ── Hoja ── */
.pagina {
  position: relative;
  width: var(--ancho);
  min-height: 100vh;
  margin-inline: auto;
  padding-block: calc(2 * var(--u)) calc(3 * var(--u));
  display: flex;
  flex-direction: column;
}

.malla {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  column-gap: var(--u);
  row-gap: 0;
}

.menor { font-size: var(--t-1); color: var(--gris); }

/* ── Subrayado que crece: marca de lo pulsable ── */
.enlace {
  background-image: linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-position: 0 100%;
  background-size: 0 1px;
  transition: background-size var(--rapido);
  padding-bottom: 1px;
}
.enlace:hover, .enlace:focus-visible, .enlace[aria-current] { background-size: 100% 1px; }

/* ── Cabecera ── */
.cabecera { align-items: baseline; }
.cabecera .nombre { grid-column: 1 / span 4; font-size: var(--t1); font-weight: 600; letter-spacing: -0.01em; justify-self: start; }
.cabecera .der { grid-column: 7 / span 6; display: flex; align-items: center; justify-content: flex-end; gap: var(--u); }
.cabecera .dato button { text-align: right; }
.isotipo { display: block; line-height: 0; }
.isotipo img { width: calc(1.25 * var(--u)); height: calc(1.25 * var(--u)); display: block; }

/* ── Vistas ── */
main { flex: 1; padding-top: calc(4 * var(--u)); }
.vista[hidden] { display: none; }

/* ── Portada ──
   Cuatro elementos en una fila, cada uno sobre tres columnas de la retícula, con el
   medianil de la hoja entre uno y otro; debajo, el título en una línea, con aire
   y alineado al borde izquierdo. Las formas son fotos recortadas por el propio
   elemento de la marca, en duotono azul. */
.hero { margin-bottom: calc(5 * var(--u)); }
.composicion {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  column-gap: var(--u);
  /* Más margen entre las formas y el título que entre las formas: el título respira. */
  row-gap: calc(1.5 * var(--u));
}
.composicion h1 {
  grid-column: 1 / -1;
  font-size: var(--t5);
  line-height: calc(2 * var(--u));
  font-weight: 600;
  letter-spacing: -0.025em;
  white-space: nowrap;
}
.forma {
  aspect-ratio: 1;
  background-color: var(--azul);
  background-size: cover;
  background-position: center;
  /* La forma recorta la foto: la máscara es el propio elemento de la marca. */
  -webkit-mask: var(--m) center / contain no-repeat;
          mask: var(--m) center / contain no-repeat;
}
.f1 { --m: url('brand/element1.svg'); }
.f2 { --m: url('brand/element2.svg'); }
.f3 { --m: url('brand/element3.svg'); }
.f4 { --m: url('brand/element4.svg'); }
@media (max-width: 720px) {
  .composicion { grid-template-columns: repeat(2, 1fr); row-gap: var(--u); }
  .composicion h1 { grid-row: 3; margin-top: var(--u); font-size: var(--t4); line-height: calc(2 * var(--u)); }
}

/* ── Índice ── */
.portada .rotulo { grid-column: 1 / span 4; font-size: var(--t1); font-weight: 600; letter-spacing: -0.01em; }

.indice { grid-column: 5 / span 8; list-style: none; }
.indice li { display: block; }
.indice a {
  display: grid;
  grid-template-columns: calc(2 * var(--u)) 1fr;
  column-gap: var(--u);
  align-items: baseline;
  padding-block: calc(var(--u) / 2);
  font-size: var(--t1);
  letter-spacing: -0.01em;
  transition: opacity var(--normal);
}
.indice .num { font-size: var(--t-1); color: var(--gris); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.indice .tit { justify-self: start; }
/* Atención: lo que no se mira cede. Mira una, las demás bajan. */
.indice:has(a:hover, a:focus-visible) a:not(:hover):not(:focus-visible) { opacity: 0.35; }

/* ── Entrada ── */
.entrada .cabeza { grid-column: 1 / span 4; align-self: start; position: sticky; top: calc(2 * var(--u)); }
.entrada h2 { font-size: var(--t1); line-height: var(--u); font-weight: 600; letter-spacing: -0.01em; margin-bottom: var(--u); }
.entrada .corrido { font-size: var(--t-1); color: var(--gris); }

/* Marcas: los cuatro elementos de la marca, a escala u, como firma de cada entrada. */
.marcas { display: flex; gap: calc(0.75 * var(--u)); margin-top: calc(3 * var(--u)); color: var(--azul); }
.marcas svg { width: var(--u); height: var(--u); display: block; overflow: visible; }

.cuerpo { grid-column: 5 / span 6; }
.terceto { white-space: pre-line; margin-bottom: var(--u); }

/* Acciones del poema: bajarlo como imagen o compartirlo. */
.acciones { grid-column: 5 / span 6; display: flex; flex-wrap: wrap; gap: var(--u); margin-top: var(--u); }
.acciones .pildora { font-size: var(--t-1); }
.acciones .pildora[disabled] { opacity: 0.4; }

/* Opciones de compartir: se revelan en el lugar, debajo del botón, sin tapar nada. */
.opciones { grid-column: 5 / span 6; display: flex; flex-wrap: wrap; gap: var(--u) calc(2 * var(--u)); margin-top: var(--u); }
.opciones[hidden] { display: none; }
.opcion[disabled] { opacity: 0.4; }

/* Aviso efímero: uno cada vez y breve. */
.aviso {
  position: fixed; left: 50%; bottom: calc(2 * var(--u)); translate: -50% 0; z-index: 30;
  padding: 0.6em 1.4em; border: 1px solid var(--azul); border-radius: 9999px;
  background: var(--blanco); color: var(--azul); font-size: var(--t-1); line-height: 1.2;
  opacity: 0; pointer-events: none; transition: opacity var(--normal);
}
.aviso.visible { opacity: 1; }

.pie-entrada { grid-column: 5 / span 6; display: flex; align-items: baseline; gap: calc(2 * var(--u)); margin-top: calc(3 * var(--u)); }
/* Índice a la izquierda, sobre el borde del texto; Anterior y Siguiente juntos a la derecha. */
.pie-entrada .indice-vuelta { margin-right: auto; }
.pie-entrada .menor a, .pie-entrada .menor button { color: var(--gris); }
.pie-entrada [aria-disabled="true"] { display: none; }

/* ── Pie de página ── */
.pie { margin-top: calc(6 * var(--u)); align-items: end; }
.pie .autor { grid-column: 1 / span 4; }

/* ── Solo para lectores de pantalla ── */
.solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ── Transición entre vistas ──
   Fundido cruzado, como en el sitio: el cambio se siente como un cambio de luz.
   La entrada dura más que la salida para que no quede un hueco a media transición. */
::view-transition-old(root) { animation: salida-vista 0.3s var(--ease) both; }
::view-transition-new(root) { animation: entrada-vista 0.5s var(--ease) both; }
@keyframes salida-vista { to { opacity: 0; } }
@keyframes entrada-vista { from { opacity: 0; } }

/* ── Ancho proporcional por tamaño de pantalla ── */
@media (min-width: 48rem) { :root { --ancho: min(76vw, 1280px); } }
@media (min-width: 64rem) { :root { --ancho: min(64vw, 1280px); } }

/* ── Pie: autor, fecha y hora de Chile (se rellenan en el navegador) ── */
.pie .fecha { grid-column: 1 / span 6; min-height: var(--u); }
.pie .hora  { grid-column: 7 / span 6; text-align: right; min-height: var(--u); }
.pie [data-reloj-hora] { font-variant-numeric: tabular-nums; }

/* Reconocimiento del financiamiento (convenio, cláusula novena): logo del Ministerio abajo a la
   izquierda, mínimo 150 px en digital, y la leyenda del Fondo. Rótulo en las columnas 1–4, texto desde la 5. */
.pie .sello { grid-column: 1 / span 4; grid-row: 1; margin-bottom: calc(2 * var(--u)); line-height: 0; }
.pie .sello img { display: block; width: 150px; height: auto; }
.pie .credito { grid-column: 5 / span 6; grid-row: 1; margin-bottom: calc(2 * var(--u)); }

@media (max-width: 720px) {
  .pie .fecha { grid-column: 1 / span 12; }
  .pie .hora  { grid-column: 1 / span 12; text-align: left; }
  .pie .sello, .pie .credito { grid-column: 1 / span 12; grid-row: auto; }
  .pie .sello { margin-bottom: var(--u); }
}

/* ── Guías de la retícula, solo en pantalla ── */
.guias { display: none; }
html.ver-grilla .guias {
  display: block;
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background:
    repeating-linear-gradient(to bottom, rgba(0,150,255,.35) 0, rgba(0,150,255,.35) 1px, transparent 1px, transparent var(--u)),
    repeating-linear-gradient(to right, rgba(255,0,90,.10) 0, rgba(255,0,90,.10) var(--col), transparent var(--col), transparent calc(var(--col) + var(--u)));
}

/* ── Móvil: rótulo arriba, texto debajo, todo a ancho completo ── */
@media (max-width: 720px) {
  .cabecera .nombre { grid-column: 1 / span 8; }
  /* En móvil la cabecera pasa a flex: el nombre a la izquierda, la botonera a la derecha, y si no caben, baja. */
  .cabecera { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; row-gap: var(--u); }
  .cabecera .nombre { grid-column: auto; }
  .cabecera .der { grid-column: auto; margin-left: auto; }
  .portada h1 { grid-column: 1 / -1; font-size: var(--t4); line-height: calc(2 * var(--u)); margin-bottom: calc(3 * var(--u)); }
  .portada .rotulo { grid-column: 1 / -1; margin-bottom: var(--u); }
  .indice { grid-column: 1 / -1; }
  .indice a { padding-block: calc(var(--u) / 2); min-height: 44px; }
  .entrada .cabeza { grid-column: 1 / -1; position: static; margin-bottom: calc(2 * var(--u)); }
  .cuerpo, .acciones, .opciones, .pie-entrada { grid-column: 1 / -1; }
  .acciones .pildora { min-height: 44px; }
  .opcion { min-height: 44px; display: inline-flex; align-items: center; }
  main { padding-top: calc(3 * var(--u)); }
}

/* ── Sin movimiento: todo cambia de golpe, el contenido sigue completo ── */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .pildora { translate: none !important; }
}
</style>
</head>
<body>
<a class="salto" href="#contenido">Saltar al contenido</a>
<div class="pagina">
  <div class="guias" aria-hidden="true"></div>

  <header class="malla cabecera">
    <a class="nombre" href="#/" id="nombre">antonio batlle</a>
    <div class="der">
      <p class="dato menor" id="dato"></p>
      <!-- El isotipo de Bastos: la editorial que sostiene este proyecto. -->
      <a class="isotipo" href="https://www.estudiobastos.com" aria-label="Estudio Bastos"><img src="brand/Isotipo-b.svg" alt="" width="26" height="26"></a>
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    <!-- Sin JavaScript, la portada queda vacía a propósito: el contenido lo arma el script desde `entradas`. -->
    <noscript><p class="menor">Esta página necesita JavaScript para leerse.</p></noscript>
  </main>

  <footer class="malla pie">
    <!-- Convenio de la beca, cláusula novena: logo del Ministerio (≥ 150 px) y leyenda del Fondo, durante toda la vida del proyecto. -->
    <div class="sello"><img src="brand/mincap-logo.png" alt="Ministerio de las Culturas, las Artes y el Patrimonio. Gobierno de Chile" width="313" height="284"></div>
    <p class="menor credito">Proyecto financiado por el Fondo Nacional de Fomento del Libro y la Lectura, Convocatoria 2026, del Ministerio de las Culturas, las Artes y el Patrimonio.</p>
    <!-- Vacíos a propósito: un valor calculado al cargar sería falso mañana. Se rellenan en el navegador. -->
    <p class="menor fecha" data-reloj-fecha></p>
    <p class="menor hora"><span data-reloj-hora></span> santiago de chile</p>
  </footer>

  <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
</div>

<script>
(() => {
  'use strict';

  /* Las entradas. `tercetos` es una lista de tercetos; cada uno, tres versos separados por \n.
     El texto es de Antonio: una entrada sin tercetos se muestra como hueco, sin inventar nada.
     PROVISORIO: los dos tercetos de «martes de verano» son los que no tienen correcciones en la
     hoja impresa; sirven para probar la lectura y se reemplazan por el texto final. */
  const todas = [
    { id: 'martes-de-verano', titulo: 'martes de verano', provisorio: true, tercetos: [
      'la fila da la vuelta\nal registro civil y desde arriba\nparece una serpiente',
      'el guardia da los números\nescritos con plumón anoto el mío\npor si llego a perderlo',
    ] },
    { id: 'jueves-de-verano',  titulo: 'jueves de verano',  tercetos: [] },
    { id: 'viernes-de-verano', titulo: 'viernes de verano', tercetos: [] },
    { id: 'domingo-de-verano', titulo: 'domingo de verano', tercetos: [] },
    { id: 'martes-de-otono',   titulo: 'martes de otoño',   tercetos: [] },
    { id: 'jueves-de-otono',   titulo: 'jueves de otoño',   tercetos: [] },
    { id: 'sabado-de-otono',   titulo: 'sábado de otoño',   tercetos: [] },
    /* Poemas de @antoniobatllel en Instagram, leídos de las publicaciones el 4-nov-2026. Transcritos a mano
       desde la pantalla: faltan por revisar. Los títulos son los de la publicación (o el primer verso). */
    { id: 'papas-duquesas', titulo: 'Papas duquesas', tercetos: [
      'brillan\nlas papas duquesas\nen la noche\ncon luz propia',
      'círculos rodeados\nde puntas luminosas\ny calientes',
      'rayos\nque indican\npor dónde seguir\ncaminando',
      'todavía brillan\nlas papas duquesas',
      'como estrellas\nque titilan una noche\nlenta de verano',
    ] },
    { id: 'vino-en-la-copa', titulo: 'Vino en la copa', tercetos: [
      'más vino en la copa, por favor',
      'no se les vaya a olvidar\nque no puede faltar\nvino en la copa',
      'puede faltar\npan en la mesa\nagua en el río\nsangre en el cuerpo',
      'pero no está permitido\nde ninguna manera\nque falte vino en la copa',
      'ya está dicho claramente\nestén atentos\nno vaya a ser que falte\nvino en la copa',
    ] },
    { id: 'loza-x-lavar', titulo: 'Loza x lavar', tercetos: [
      'Todavía queda\nloza x lavar\npero yo prefiero\nhacer otra cosa',
      'retocar un dibujo\nafinar la guitarra\nrevolver los fideos',
      'lo que sea menos\nlavar la loza',
      'incluso escribir un poema\nme sería + fácil',
      '+ satisfactorio\n+ placentero\n+ estimulante',
      'que lavar esa loza\nsucia desde ayer',
    ] },
    { id: 'me-preguntan-como-esta-la-poesia', titulo: 'me preguntan cómo está la poesía', tercetos: [
      'salgo un viernes de noche\nme encuentro con algunos amigos\nque no veo hace tiempo\nme preguntan cómo está la poesía',
      'está bien –les digo– pero pienso\nqué sé yo cómo está\npregúntenle a ella',
      'seguramente está molesta\ncon tanto farsante dando vueltas\nque se dice poeta',
      'los peores son esos\n–debe decir la poesía–\nque cuentan anécdotas\nde su vida cotidiana\nque no le interesan a nadie\nlas disfrazan de versitos\ny las suben a instagram\nmendigando un par de likes',
    ] },
    { id: 'una-nina-en-la-plaza', titulo: 'Una niña en la plaza', tercetos: [
      'Una niña en la plaza\npersigue una paloma\ny se divierte\nhasta que el padre\n–o quizá la madre–\nle grita desde lejos\nque ya es hora de irse\npero la niña sigue\njugando a ser paloma\ny corre con sus brazos\ntratando de ser alas\ny de pronto se eleva\ny flota por el aire,\ncierra los ojos\ny olvida que la madre\n–o quizá el padre–\nla sostiene en sus brazos.',
    ] },
    { id: 'negocios', titulo: 'negocios', tercetos: [
      'evito hacer aseo\nevito trabajar',
      'y para evitarlo\ntrabajo en otra cosa\nordeno el sillón\ndel living',
      'hasta que me canso\ny evito trabajar\nen otra cosa',
      'evito ordenar\nel sillón del living',
      'y entonces hago aseo\ny trabajo',
      'y así.',

        el('span', { className: 'num', textContent: String(i + 1).padStart(2, '0') }),
        el('span', { className: 'tit enlace', textContent: e.titulo }));
      lista.append(el('li', {}, a));
    });

    /* El subrayado crece cuando la fila recibe puntero o foco. */
    lista.addEventListener('pointerover', (ev) => marcar(ev.target.closest('a'), true));
    lista.addEventListener('pointerout',  (ev) => marcar(ev.target.closest('a'), false));
    lista.addEventListener('focusin',  (ev) => marcar(ev.target.closest('a'), true));
    lista.addEventListener('focusout', (ev) => marcar(ev.target.closest('a'), false));
    function marcar(a, on) { if (a) a.querySelector('.enlace').toggleAttribute('aria-current', on); }

    /* Portada: el título a la izquierda, partido en líneas como en una tapa; a la derecha, los
       cuatro elementos de la marca hechos máscara. Cada uno es un hueco para una foto: sin foto
       queda azul liso, con foto la recorta con su forma. */
    const composicion = el('div', { className: 'composicion' });
    [1, 2, 3, 4].forEach((n, i) => {
      const f = fotos[i];
      const forma = el('div', { className: 'forma f' + n });
      if (f) { forma.style.backgroundImage = `url("${f.src}")`; if (f.pos) forma.style.backgroundPosition = f.pos; if (f.zoom) forma.style.backgroundSize = f.zoom; forma.setAttribute('role', 'img'); forma.setAttribute('aria-label', f.alt); forma.classList.add('con-foto'); }
      else forma.setAttribute('aria-hidden', 'true');
      composicion.append(forma);
    });
    composicion.append(el('h1', { textContent: 'cosas que pasan' }));

    const hero = el('section', { className: 'hero malla', ariaLabel: 'Portada' }, composicion);

    const indice = el('section', { className: 'portada malla', ariaLabel: 'Entradas' },
      el('p', { className: 'rotulo', textContent: 'Entradas' }),
      lista);

    const vista = el('div', { className: 'vista' }, hero, indice);
    contenido.replaceChildren(vista);
  }

  function vistaEntrada(id) {
    const idx = entradas.findIndex((e) => e.id === id);
    if (idx < 0) { location.replace('#/'); return; }
    const e = entradas[idx];
    abierta = e;
    document.title = `${e.titulo} · cosas que pasan`;
    dato.replaceChildren();

    const cabeza = el('div', { className: 'cabeza' },
      el('h2', { textContent: e.titulo }),
      el('p', { className: 'corrido menor', textContent: `${idx + 1} de ${entradas.length}` }),
      marcas());

    /* El poema entero, de una vez. */
    const cuerpo = el('article', { className: 'cuerpo', ariaLabel: e.titulo });
    e.tercetos.forEach((t) => cuerpo.append(el('p', { className: 'terceto', textContent: t })));

    /* Compartir, como en Spotify: un botón que abre las opciones. */
    const compartir = el('button', { className: 'pildora', type: 'button', textContent: 'Compartir', onclick: () => alternarOpciones() });
    compartir.setAttribute('aria-expanded', 'false');
    compartir.dataset.iman = '';
    const opcion = (texto, fn) => { const b = el('button', { className: 'opcion enlace', type: 'button', textContent: texto }); b.onclick = () => fn(b); return b; };
    const opciones = el('div', { className: 'opciones', hidden: true, role: 'group', ariaLabel: 'Compartir este poema' },
      opcion('Copiar enlace', () => copiarEnlace(e)),
      opcion('WhatsApp', () => whatsapp(e)),
      opcion('Historia de Instagram', (b) => accion(b, e, 'historia')),
      opcion('Descargar PNG', (b) => accion(b, e, 'bajar')));
    if (tactil() && navigator.share) opciones.append(opcion('Más…', () => navigator.share({ title: e.titulo, url: enlaceDe(e) }).catch(() => {})));
    function alternarOpciones(abrir) {
      const abre = abrir === undefined ? opciones.hidden : abrir;
      opciones.hidden = !abre;
      compartir.setAttribute('aria-expanded', String(abre));
      if (abre) opciones.querySelector('button').focus();
    }
    const acciones = el('div', { className: 'acciones' }, compartir);

    const ant = entradas[idx - 1], sig = entradas[idx + 1];
    const pie = el('nav', { className: 'pie-entrada menor', ariaLabel: 'Entradas' },
      el('a', { className: 'enlace indice-vuelta', href: '#/', textContent: 'Índice' }),
      enlaceEntrada(ant, 'Anterior'),
      enlaceEntrada(sig, 'Siguiente'));

    contenido.replaceChildren(el('section', { className: 'vista entrada malla' }, cabeza, cuerpo, acciones, opciones, pie));
  }

  /* Los cuatro elementos de la marca, a escala u: la firma de la entrada. */
  function marcas() {
    const m = el('div', { className: 'marcas', ariaHidden: 'true' });
    m.innerHTML =
      '<svg viewBox="0 0 256.25 256.25" fill="currentColor"><rect x="18.76" y="146.89" width="90.6" height="90.6" transform="translate(-117.13 101.59) rotate(-45)"/><rect x="18.76" y="18.76" width="90.6" height="90.6" transform="translate(-26.54 64.06) rotate(-45)"/><rect x="146.89" y="146.89" width="90.6" height="90.6" transform="translate(-79.61 192.19) rotate(-45)"/><rect x="146.89" y="18.76" width="90.6" height="90.6" transform="translate(10.99 154.66) rotate(-45)"/></svg>' +
      '<svg viewBox="0 0 256.21 256.25" fill="currentColor"><path d="M0,153.74h66.26l-46.85,46.85,36.23,36.23,46.83-46.83v66.26h51.23v-66.27l46.87,46.87,36.23-36.23-46.88-46.88h66.29v-51.23h-66.26l46.85-46.85-36.23-36.23-46.87,46.87V0h-51.23v66.29L55.61,19.43,19.38,55.65l46.85,46.85H0v51.23ZM102.47,138.74v-21.21l15.03-15.03h21.19l15.01,15.01v21.23l-14.99,14.99h-21.25l-15-15Z"/></svg>' +
      '<svg viewBox="0 0 256.25 256.25" fill="currentColor"><rect x="128.12" y="128.12" width="128.12" height="128.12" rx="64.06" ry="64.06"/><rect x="0" y="0" width="128.12" height="128.12" rx="64.06" ry="64.06"/><rect x="128.12" y="0" width="128.12" height="128.12" rx="64.06" ry="64.06"/><rect x="0" y="128.12" width="128.12" height="128.12" rx="64.06" ry="64.06"/></svg>' +
      '<svg viewBox="0 0 255.77 256.25" fill="currentColor"><path d="M15.54,144.7c21.49-10.18,52.86-16.58,96.73-16.58-43.8,0-75.13-6.38-96.62-16.53-31.08-14.68-11.2-62.72,21.16-51.12,22.36,8.02,49.02,25.66,79.99,56.62-31.14-31.14-48.81-57.95-56.76-80.4C48.57,4.3,96.38-15.48,111.17,15.54c10.25,21.5,16.7,52.94,16.7,96.98,0-43.84,6.39-75.19,16.55-96.68,14.69-31.07,62.68-11.23,51.13,21.14-7.99,22.39-25.64,49.1-56.65,80.11,31-31,57.7-48.65,80.07-56.66,32.36-11.57,52.23,36.41,21.16,51.12-21.48,10.17-52.82,16.56-96.66,16.56,43.91,0,75.29,6.42,96.77,16.61,31.04,14.73,11.18,62.65-21.18,51.11-22.4-7.99-49.12-25.64-80.16-56.71,31.06,31.06,48.72,57.81,56.7,80.23,11.53,32.38-36.41,52.21-51.13,21.15-10.19-21.5-16.6-52.89-16.6-96.81,0,44.05-6.46,75.5-16.71,97-14.79,31.01-62.6,11.22-51.13-21.17,7.95-22.45,25.62-49.26,56.76-80.4-30.99,31.02-57.68,48.67-80.07,56.67-32.36,11.57-52.24-36.41-21.18-51.11Z"/></svg>';
    return m;
  }

  function enlaceEntrada(e, texto) {
    if (!e) return el('span', { ariaDisabled: 'true', textContent: texto });
    return el('a', { className: 'enlace', href: `#/${e.id}`, textContent: texto });
  }

  /* ── Imagen del poema ──
     Cada poema se baja o se comparte como PNG con el diseño de los posts de Instagram de Bastos (el de
     «Sábado, Viña del Mar»): EB Garamond a 35 px con interlínea 1,38, azul #003EC0 sobre papel #F2F3F9, el
     poema centrado en la lámina y alineado a la izquierda, y el título en negrita pegado al primer verso.
     Sin pie, sin logo y sin numeración. Dos formatos: «post» (1080 × 1350, 4:5) e «historia» (1080 × 1920, 9:16).
     Se dibuja en un canvas: sin librerías y sin enviar nada a ningún servidor. Un poema largo se reparte en
     varias láminas, de a estrofas completas, para que sirva de carrusel. */
  const PAPEL = '#F2F3F9', TINTA = '#003EC0';
  const TAM = 35, LH = TAM * 1.38; // la interlínea también es el espacio entre estrofas

  const envolver = (ctx, linea, ancho) => {
    if (!linea.trim()) return [''];
    const salida = []; let actual = '';
    for (const palabra of linea.split(' ')) {
      const prueba = actual ? actual + ' ' + palabra : palabra;
      if (!actual || ctx.measureText(prueba).width <= ancho) actual = prueba;
      else { salida.push(actual); actual = palabra; }
    }
    salida.push(actual);
    return salida;
  };

  async function crearImagenes(e, formato = 'post') {
    const historia = formato === 'historia';
    const w = 1080, h = historia ? 1920 : 1350;
    const maxAncho = 840;                  // márgenes de 120 px a cada lado
    const maxAlto = historia ? 1100 : 1030; // en la historia, Instagram tapa ~250 px arriba y abajo
    const tipo = (peso) => `${peso} ${TAM}px "EB Garamond", Georgia, serif`;
    await Promise.all([document.fonts.load(tipo(400)), document.fonts.load(tipo(700))]);
    const lienzo = document.createElement('canvas'); lienzo.width = w; lienzo.height = h;
    const ctx = lienzo.getContext('2d');

    /* El título va en negrita, pegado al primer verso, y solo si no es ese mismo verso: así no se repite. */
    const limpio = (x) => x.trim().toLowerCase().replace(/[.,;:!?¡¿]+$/, '');
    const conTitulo = limpio(e.titulo) !== limpio(e.tercetos[0].split('\n')[0]);

    /* Cada estrofa es una lista de líneas { t: texto, b: negrita }, con los versos largos ya partidos. */
    ctx.font = tipo(400);
    const bloques = e.tercetos.map((t) => t.split('\n').flatMap((l) => envolver(ctx, l, maxAncho)).map((x) => ({ t: x, b: false })));
    if (conTitulo) bloques[0].unshift({ t: e.titulo, b: true });

    /* Se reparten en láminas por estrofas completas; una estrofa más alta que la lámina se parte por líneas. */
    const maxLineas = Math.floor(maxAlto / LH);
    const alto = (n, estrofas) => (n + estrofas - 1) * LH; // n líneas y `estrofas` bloques
    const paginas = [];
    let actual = [], lineas = 0;
    const cerrar = () => { if (actual.length) paginas.push(actual); actual = []; lineas = 0; };
    bloques.forEach((b) => {
      const partes = [];
      for (let i = 0; i < b.length; i += maxLineas) partes.push(b.slice(i, i + maxLineas));
      partes.forEach((p) => {
        if (actual.length && alto(lineas + p.length, actual.length + 1) > maxAlto) cerrar();
        actual.push(p); lineas += p.length;
      });
    });
    cerrar();

    const blobs = [];
    for (const pagina of paginas) {
      ctx.fillStyle = PAPEL; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = TINTA; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      const todas = pagina.flat();
      const ancho = Math.max(...todas.map((l) => { ctx.font = tipo(l.b ? 700 : 400); return ctx.measureText(l.t).width; }));
      const x = Math.round((w - ancho) / 2);
      let y = Math.round((h - alto(todas.length, pagina.length)) / 2);
      pagina.forEach((bloque, i) => {
        if (i) y += LH;
        bloque.forEach((l) => {
          ctx.font = tipo(l.b ? 700 : 400);
          const m = ctx.measureText(l.t);
          const a = m.fontBoundingBoxAscent, d = m.fontBoundingBoxDescent;
          ctx.fillText(l.t, x, y + (LH - (a + d)) / 2 + a);
          y += LH;
        });
      });
      blobs.push(await new Promise((ok) => lienzo.toBlob(ok, 'image/png')));
    }
    return blobs;
  }

  const nombreArchivo = (e, i, n, formato = 'post') => `${e.id}${formato === 'historia' ? '-historia' : ''}${n > 1 ? '-' + (i + 1) : ''}.png`;

  function descargar(blobs, e, formato) {
    blobs.forEach((b, i) => setTimeout(() => {
      const a = el('a', { href: URL.createObjectURL(b), download: nombreArchivo(e, i, blobs.length, formato) });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, i * 350));
  }

  let temporizadorAviso;
  function avisar(texto) {
    const n = $('#aviso'); n.textContent = texto; n.classList.add('visible');
    clearTimeout(temporizadorAviso); temporizadorAviso = setTimeout(() => n.classList.remove('visible'), 3400);
  }

  /* La hoja de compartir del sistema solo se usa en pantallas táctiles: en Windows y Mac abre un diálogo
     del sistema que no lleva a ninguna parte útil, y ahí es mejor bajar la imagen. */
  const tactil = () => matchMedia('(pointer: coarse)').matches;

  /* El enlace de un poema lleva su ruta en el hash: al abrirlo cae directo en él. */
  const enlaceDe = (e) => `${location.origin}${location.pathname}#/${e.id}`;

  async function copiarSilencio(e) {
    const url = enlaceDe(e);
    try { await navigator.clipboard.writeText(url); }
    catch (_) {
      /* Sin permiso del portapapeles (por ejemplo, en una página sin https): se copia con un campo temporal. */
      const t = el('textarea', { value: url }); t.style.cssText = 'position:fixed;opacity:0'; document.body.append(t); t.select();
      try { document.execCommand('copy'); } catch (__) {} t.remove();
    }
  }

  async function copiarEnlace(e) { await copiarSilencio(e); avisar('Enlace copiado'); }

  function whatsapp(e) {
    window.open(`https://wa.me/?text=${encodeURIComponent(`${e.titulo} ${enlaceDe(e)}`)}`, '_blank', 'noopener');
  }

  /* Imagen y enlace, como al compartir de Spotify a una historia: Instagram no deja pegar el sticker del enlace
     desde una página web, así que el enlace del poema se copia a la vez y el sticker «Enlace» de la historia lo
     ofrece al pegarlo. En el celular se abre la hoja de compartir del sistema, donde está Instagram. */
  async function accion(boton, e, que) {
    boton.disabled = true;
    const historia = que === 'historia';
    try {
      if (historia) await copiarSilencio(e); // primero, mientras el toque del usuario sigue vigente
      const blobs = await crearImagenes(e, historia ? 'historia' : 'post');
      const varias = blobs.length > 1;
      if (historia) {
        const archivos = blobs.map((b, i) => new File([b], nombreArchivo(e, i, blobs.length, 'historia'), { type: 'image/png' }));
        if (tactil() && navigator.canShare && navigator.canShare({ files: archivos })) {
          try { await navigator.share({ files: archivos, title: e.titulo }); avisar('Enlace copiado para el sticker'); }
          catch (err) { if (err.name !== 'AbortError') { descargar(blobs, e, 'historia'); avisar('Imagen descargada y enlace copiado'); } }
        } else { descargar(blobs, e, 'historia'); avisar(varias ? 'Imágenes descargadas y enlace copiado' : 'Imagen descargada y enlace copiado'); }
      } else { descargar(blobs, e, 'post'); avisar(varias ? `${blobs.length} imágenes descargadas` : 'Imagen descargada'); }
    } catch (err) { avisar('No se pudo crear la imagen'); }
    boton.disabled = false;
  }

  /* ── Ruta ──
     El estado vive en el hash: atrás, recargar y compartir llevan al mismo lugar. */
  function ruta(animar = true) {
    const id = location.hash.replace(/^#\/?/, '');
    const dibujar = () => { id ? vistaEntrada(id) : vistaIndice(); window.scrollTo(0, 0); };
    /* Con la pestaña oculta la transición no corre y retrasa el dibujo: ahí se dibuja directo. */
    if (animar && document.startViewTransition && !reducido.matches && document.visibilityState === 'visible') {
      /* Red de seguridad: si el navegador demora la transición, la vista se dibuja igual a los 0,4 s. */
      let hecho = false;
      const una = () => { if (hecho) return; hecho = true; dibujar(); };
      const vt = document.startViewTransition(una);
      /* Si la transición se aborta (otra ruta llegó antes), no es un error: se ignora. */
      vt.ready.catch(() => {}); vt.finished.catch(() => {}); vt.updateCallbackDone.catch(() => {});
      setTimeout(una, 400);
    } else dibujar();
  }
  addEventListener('hashchange', () => ruta(true));

  /* ── Teclado ──
     Esc vuelve al índice; [ y ] cambian de entrada; g muestra la retícula. */
  addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key;
    if (k === 'g') { root.classList.toggle('ver-grilla'); return; }
    if (!abierta) return;
    if (k === 'Escape') {
      const abiertas = $('.opciones:not([hidden])');
      if (abiertas) { abiertas.hidden = true; const b = $('.acciones .pildora'); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus(); } }
      else location.hash = '#/';
    }
    else if (k === ']' || k === '[') {
      const i = entradas.indexOf(abierta) + (k === ']' ? 1 : -1);
      if (entradas[i]) location.hash = `#/${entradas[i].id}`;
    }
  });

  /* ── Imán del puntero ──
     Mueve hacia el cursor las píldoras marcadas con data-iman cuando el puntero entra en su
     radio, y las devuelve al salir. Va en `translate`, que no toca el flujo: el hueco queda
     donde estaba y nada de alrededor se mueve. Va cuadro a cuadro y no por transición porque
     la posición depende del puntero en cada instante. En reposo el bucle se apaga. */
  const FUERZA = 0.55, ALCANCE = 64, TOPE = 22, SEGUIMIENTO = 0.18;
  let puntero = null, cuadro = 0;
  const imanes = new Map();
  const fino = () => matchMedia('(hover: hover) and (pointer: fine)').matches && !reducido.matches;

  function pintarImanes() {
    cuadro = 0;
    let vivo = false;
    document.querySelectorAll('[data-iman]').forEach((n) => {
      const s = imanes.get(n) || { x: 0, y: 0 };
      imanes.set(n, s);
      const c = n.getBoundingClientRect();
      if (!c.width) { s.x = s.y = 0; return; }
      let mx = 0, my = 0;
      if (puntero) {
        const dx = puntero.x - (c.left + c.width / 2 - s.x), dy = puntero.y - (c.top + c.height / 2 - s.y);
        const lejos = Math.hypot(dx / (c.width / 2 + ALCANCE), dy / (c.height / 2 + ALCANCE));
        if (lejos < 1) {
          const tiron = (1 - lejos) ** 1.5 * FUERZA;
          mx = Math.max(-TOPE, Math.min(TOPE, dx * tiron));
          my = Math.max(-TOPE, Math.min(TOPE, dy * tiron));
        }
      }
      s.x += (mx - s.x) * SEGUIMIENTO;
      s.y += (my - s.y) * SEGUIMIENTO;
      if (Math.abs(s.x) < 0.25 && Math.abs(s.y) < 0.25 && !mx && !my) { s.x = s.y = 0; n.style.translate = ''; }
      else { n.style.translate = `${s.x.toFixed(2)}px ${s.y.toFixed(2)}px`; vivo = true; }
    });
    if (vivo) cuadro = requestAnimationFrame(pintarImanes);
  }
  const despertar = () => { if (!cuadro) cuadro = requestAnimationFrame(pintarImanes); };
  document.addEventListener('pointermove', (ev) => {
    if (ev.pointerType !== 'mouse' || !fino()) return;
    puntero = { x: ev.clientX, y: ev.clientY };
    despertar();
  }, { passive: true });
  root.addEventListener('pointerleave', () => { puntero = null; despertar(); });
  addEventListener('scroll', despertar, { passive: true });

  /* ── Pie con la fecha y la hora de Chile ──
     Todo se resuelve en el navegador. Cifras de ancho fijo: sin eso el reloj se mueve en cada dígito. */
  const zona = 'America/Santiago';
  const fFecha = new Intl.DateTimeFormat('es-CL', { timeZone: zona, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const fHora = new Intl.DateTimeFormat('es-CL', { timeZone: zona, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const reloj = () => {
    const ahora = new Date();
    $('[data-reloj-fecha]').textContent = fFecha.format(ahora);
    $('[data-reloj-hora]').textContent = fHora.format(ahora);
  };
  reloj();
  setInterval(reloj, 1000);

  if (location.search.includes('grilla')) root.classList.add('ver-grilla');
  ruta(false);
})();
</script>
</body>
</html>
